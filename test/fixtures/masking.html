<!-- 가림 정확성 픽스처.
     스크린샷에서 실제로 노출됐던 형태들을 그대로 재현한다:
     캐멀케이스 아바타, 배경이미지 아바타, 유튜브 임베드, 스티커, 사진(단일/캐러셀). -->
<meta charset="utf-8"><title>masking fixture</title>
<style>body{margin:0;font:13px sans-serif}li{list-style:none;padding:4px 8px}
/* 디스코드가 하는 일: 나를 부른 메시지에 주황빛을 깐다 */
.mentioned__m1{background-color:rgb(250,240,215)}
.mentionedWrap__m2{background-color:rgb(250,240,215)}
.mentioned__m1::after{content:"";position:absolute;inset:0;background-color:rgb(250,240,215)}
</style>
<div id="app-mount" class="theme-darker">
  <!-- 아래 크롬 4종은 실제 디스코드 DOM 에서 뜬 클래스·중첩을 그대로 옮긴 것이다.
       서버·채널 이름이 그대로 노출되던 자리다. -->
  <div class="title_c38106">
    <div class="title_edbb22">
      <div class="defaultColor__4bd52 lineClamp1__4bd52 text-sm/medium_cf4812">히키특수학교</div>
    </div>
    <div class="toolbar__t1"><span>아이콘</span></div>
  </div>
  <div class="children__9293f">
    <div class="titleWrapper__9293f">
      <h1 class="defaultColor__4bd52 text-md/medium_cf4812 title__9293f">tts_카미사마봇</h1>
      <!-- 채널 설명(주제)도 서버·채널 이름과 같은 성격의 노출이다 -->
      <div class="topic__9293f">카미쨩으로 말해요</div>
    </div>
  </div>
  <div class="search__49676">
    <div><span><span>히키특수학교 검색</span></span></div>
    <svg viewBox="0 0 16 16"><path d="M0 0h4v4H0z"></path></svg>
  </div>
  <!-- 검색 "결과" 패널. 클래스에 search 가 들어가고 안의 실제 메시지가 우연히
       "…검색" 으로 끝난다. 안내문으로 오인해 덮어쓰면 안 된다. -->
  <div class="searchResultsWrap__r1">
    <div class="messageContent__r3">다른 메시지</div>
    <!-- 마지막에 둔 것이 핵심이다. 구현이 "직접 텍스트를 가진 마지막 요소" 를
         고르므로, 이게 중간에 있으면 우연히 비켜가서 테스트가 통과해 버린다. -->
    <div class="messageContent__r2">자료 검색</div>
  </div>
  <!-- 결과가 하나뿐이면 컨테이너 전체 텍스트도 "…검색" 이 된다 -->
  <div class="searchResults__r4"><div class="messageContent__r5">회의록 검색</div></div>

  <div class="guilds__a1"></div>
  <div class="sidebar__b2"></div>
  <div class="chat__c3"><ol id="rows"></ol></div>

  <div class="channelTextArea_f75fb0 channelTextArea__74017">
    <div class="textArea__74017 textAreaSlate__74017 slateContainer_ec4baf">
      <div>
        <!-- 실제 안내문에는 채널 이모지가 섞여 있다(프로브에서 확인).
             이모지가 있으면 scanTextEmojis 가 텍스트 노드를 쪼개므로,
             "직접 텍스트를 가진 마지막 요소" 같은 heuristic 은 여기서 깨진다. -->
        <div class="placeholder__1b31f slateTextArea_ec4baf">#🎀 | tts_카미사마봇에 메시지 보내기</div>
      </div>
    </div>
  </div>
</div>
<script>
// naturalWidth 가 100 이상이어야 사진 스캔의 크기 필터를 통과한다
const BIG = 'data:image/svg+xml;base64,' + btoa(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150">' +
  '<rect width="200" height="150" fill="#999"/></svg>');
const CDN = 'https://cdn.discordapp.com';

const guilds = document.querySelector('.guilds__a1');
for (let i = 0; i < 3; i++) {
  const im = document.createElement('img');
  im.className = 'guildIcon__q';
  im.src = CDN + '/icons/' + i + '/g.png';
  guilds.append(im);
}

document.querySelector('.sidebar__b2').innerHTML =
  '<div class="containerDefault__c">🌈 | 히키특수학교 💚</div>' +
  // 캐멀케이스 — [class*="avatar"] 가 대소문자 때문에 놓치던 형태
  '<div class="voiceUser__v"><img class="voiceUserAvatar__w" src="' + CDN + '/avatars/11/x.png"></div>' +
  '<div class="voiceUser__v"><img class="replyAvatar__w" src="' + CDN + '/avatars/12/y.png"></div>' +
  // img 가 아니라 인라인 background-image 로 그려지는 아바타
  '<div class="panelAvatar__p" style="background-image:url(' + CDN + '/avatars/13/z.png);width:32px;height:32px"></div>' +
  // 처음엔 배경이 비어 있다. 길드 전환·비동기 로딩으로 나중에 배너가 붙는
  // 상황을 테스트가 재현한다 (같은 노드를 유지한 채 style 만 바뀐다).
  '<div class="bannerLate__b9" style="width:100px;height:40px"></div>';

const rows = document.getElementById('rows');
// 실제 디스코드는 아바타를 절대배치하고 본문에 큰 padding-left 를 준다.
// 아바타를 없애도 그 여백이 남는 게 이 구조 때문이다.
const li = (id, inner) =>
  '<li id="chat-messages-1-' + id + '" role="article" style="padding-left:72px">' +
  '<img class="avatar__h1" src="' + CDN + '/avatars/1/a.png" alt="쿠쿠">' +
  // 역할 색은 인라인 style 로 온다
  '<span class="username__y" style="color:rgb(233,30,99)">쿠쿠</span>' +
  '<div class="contents__x">' + inner + '</div></li>';

rows.innerHTML =
  // 1) 링크 임베드 (embed* 클래스가 중첩된 구조 — 가장 바깥만 접혀야 한다)
  li(1,
    '<div class="markup__z">보세요 😀</div>' +
    '<article class="embedWrapper__e1"><div class="embedFull__e2">' +
    '<div class="embedProvider__e3">YouTube</div>' +
    '<a class="embedTitleLink__e4" href="https://www.youtube.com/shorts/abc">제목</a>' +
    '<img class="embedImage__e5" src="' + BIG + '">' +
    // 실제 유튜브 임베드는 재생을 누르면 iframe 플레이어가 들어온다.
    // 펼쳤을 때 이것까지 보여야 재생이 된다.
    '<iframe class="embedPlayer__e6" src="about:blank"></iframe>' +
    '</div></article>') +
  // 2) 스티커 (디스코드가 이름을 내장 렌더한다)
  li(2,
    '<div class="stickerContainer__s1" style="width:160px;height:160px">' +
    '<img class="stickerAsset__s2" src="https://media.discordapp.net/stickers/9/s.png" alt="시오짱">' +
    '<div class="stickerName__s3">시오짱</div></div>') +
  // 3) 단일 첨부 사진
  li(3, '<div class="imageWrapper__i1"><img class="lazyImg__i2" src="' + BIG + '"></div>') +
  /* 5) 나에게 온 답장·멘션. 디스코드는 이 메시지에 주황빛 배경을 깔고,
        그라데이션 역할을 가진 닉네임은 background-clip:text 로 그린다.
        둘 다 워크시트에서 가장 먼저 눈에 띄는 것들이다. */
  '<li id="chat-messages-1-5" role="article" class="mentioned__m1" style="padding-left:72px">' +
  '<span class="username__y gradientName__g1" ' +
  'style="background-image:linear-gradient(90deg,#f00,#00f);' +
  '-webkit-background-clip:text;-webkit-text-fill-color:transparent">나미</span>' +
  '<div class="contents__x mentionedWrap__m2">답장이다</div></li>' +
  // 4) 캐러셀 묶음 — 대표 하나만 버튼이 붙고 묶음 단위로 펼쳐져야 한다
  li(4,
    '<div class="carousel__c1">' +
    '<div class="imageWrapper__i1"><img class="lazyImg__i2" src="' + BIG + '"></div>' +
    '<div class="imageWrapper__i1"><img class="lazyImg__i2" src="' + BIG + '"></div>' +
    '<div class="imageWrapper__i1"><img class="lazyImg__i2" src="' + BIG + '"></div>' +
    '</div>');

// 이미지 디코딩이 끝나야 naturalWidth 가 잡힌다
window.__ready = Promise.all(
  [...document.images].map((im) => (im.complete ? null : new Promise((r) => {
    im.addEventListener('load', r, { once: true });
    im.addEventListener('error', r, { once: true });
  })))
).then(() => true);
</script>
